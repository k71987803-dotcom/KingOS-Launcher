name: KingOS APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download KingOS
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build KingOS APK
        run: gradle assembleDebug --stacktrace

      - name: Upload KingOS APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KingOS-Launcher-1.0
          
          path: app/build/outputs/apk/debug/*.apk
